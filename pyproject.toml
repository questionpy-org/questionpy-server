[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "questionpy-server"
description = "QuestionPy application server"
authors = ["Technische Universität Berlin, innoCampus <info@isis.tu-berlin.de>"]
license = "MIT"
homepage = "https://questionpy.org"
version = "0.6.1"
packages = [
    { include = "questionpy_common" },
    { include = "questionpy_server" }
]

[tool.poetry.dependencies]
python = "^3.12"
aiohttp = "^3.11.18"
pydantic = "^2.11.4"
pydantic-settings = "^2.9.1"
watchdog = "^6.0.0"
semver = "^3.0.4"
psutil = "^7.0.0"
jinja2 = "^3.1.6"

[tool.poetry.group.dev.dependencies]
types-psutil = "^7.0.0.20250516"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^8.3.5"
pytest-aiohttp = "^1.1.0"
pytest-md = "^0.2.0"
coverage = { extras = ["toml"], version = "^7.8.0" }
pytest-archon = "^0.0.6"
polyfactory = "^2.21.0"

[tool.poetry.group.linter]
dependencies = { ruff = "^0.11.10" }
optional = true

[tool.poetry.group.type-checker]
dependencies = { mypy = "^1.15.0" }
optional = true

[tool.ruff]
extend = "ruff_defaults.toml"

[tool.ruff.lint.extend-per-file-ignores]
# unused-async (aiohttp handlers must be async even if they don't use it)
"**/questionpy_server/web/**/*" = ["RUF029"]

[tool.ruff.lint.pylint]
allow-dunder-method-names = ["__get_pydantic_core_schema__"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
# https://github.com/pytest-dev/pytest-asyncio#auto-mode
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope="function"

# This section is read automatically by Coverage.py when its working directory is .
# https://coverage.readthedocs.io/en/6.5.0/config.html#configuration-reference
[tool.coverage.run]
branch = true
source = ["questionpy_common", "questionpy_server"]

[tool.mypy]
plugins = "pydantic.mypy"
disallow_untyped_defs = true
strict_optional = true
show_error_codes = true
